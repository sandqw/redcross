         select name, open_mode from V\$database;
         UPDATE FND_CONCURRENT_QUEUE_SIZE A
         SET A.MIN_PROCESSES='10',
         A.MAX_PROCESSES='10'
         WHERE A.CONCURRENT_QUEUE_ID=(SELECT B.CONCURRENT_QUEUE_ID FROM
         FND_CONCURRENT_QUEUES_VL B WHERE B.USER_CONCURRENT_QUEUE_NAME='Standard Manager');
         COMMIT;
         UPDATE FND_CONCURRENT_QUEUES_VL
         SET MAX_PROCESSES='10',
         MIN_PROCESSES='10',
         TARGET_PROCESSES='10'
         WHERE USER_CONCURRENT_QUEUE_NAME='Standard Manager';
         COMMIT;
         exit;
         EOF
      environment:
        ORACLE_SID: "{{ oracle_sid }}"
        ORACLE_HOME: "{{ oracle_home }}"
        LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
      become: true
      become_user: oracle
      delegate_to: oracle
      register: r2
