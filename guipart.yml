---
- name: The 4.1.1
  hosts: "{{ host }}"
  gather_facts: yes
  vars_prompt:
    - name: "vars_file"
      prompt: "Which vars file do you want to use? (dev/test/prod)"
      private: no
    - name: "host"
      prompt: "Enter the hostname of the server to configure (apr12dev01/apr12tst01)"
      private: no
  vars_files:
    - "{{ vars_file }}.yml"
    - pass.yml
  vars:
    ansible_connection_timeout: 86400
  tasks:

    - name: Update the Number of Processes for concurrent Managers
      shell: |
        ORACLE_SID={{ oracle_sid }}
        LD_LIBRARY_PATH={{ oracle_home}}/lib
        {{ sqlplus_executable }} apps/REDCROSS1@{{ container }} << EOF
         select name, open_mode from V\$database;
         UPDATE FND_CONCURRENT_QUEUE_SIZE A
         SET A.MIN_PROCESSES='5',
         A.MAX_PROCESSES='5'
         WHERE A.CONCURRENT_QUEUE_ID=(SELECT B.CONCURRENT_QUEUE_ID FROM
         FND_CONCURRENT_QUEUES_VL B WHERE USER_CONCURRENT_QUEUE_NAME='ARC OM Manager');
         COMMIT;
         UPDATE FND_CONCURRENT_QUEUES_VL
         SET MAX_PROCESSES='5',
         MIN_PROCESSES='5',
         TARGET_PROCESSES='5'
         WHERE USER_CONCURRENT_QUEUE_NAME='ARC OM Manager';
         COMMIT;
         exit;
         EOF
      environment:
        ORACLE_SID: "{{ oracle_sid }}"
        ORACLE_HOME: "{{ oracle_home }}"
        LD_LIBRARY_PATH: "{{ oracle_home }}/lib"
      become: true
      become_user: oracle
      delegate_to: oracle
      register: r1
    - debug:
        var: r1.stdout_lines

    - name: Update the Number of Processes for concurrent Managers
      shell: |
        ORACLE_SID={{ oracle_sid }}
        LD_LIBRARY_PATH={{ oracle_home}}/lib
